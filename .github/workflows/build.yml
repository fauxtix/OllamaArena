name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OllamaArena.slnx

      - name: Build
        run: dotnet build OllamaArena.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test OllamaArena.slnx --no-build --configuration Release
