name: Deploy IIS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -file {0}
    env:
      IIS_SITE_PATH: ${{ vars.IIS_SITE_PATH || 'C:\inetpub\wwwroot\OllamaArena' }}
      IIS_APP_POOL: ${{ vars.IIS_APP_POOL || 'OllamaArena' }}
      SITE_PORT: ${{ vars.IIS_SITE_PORT || '4800' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (Release)
        run: |
          dotnet publish "$env:GITHUB_WORKSPACE\OllamaArena\OllamaArena.csproj" -c Release -o "$env:RUNNER_TEMP\publish" --nologo

      - name: Migrate IIS site/pool/path -> OllamaArena (once, idempotent)
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration
          $newSite = 'OllamaArena'
          $target = "C:\inetpub\wwwroot\$newSite"
          $old = Get-Website | Where-Object { $_.physicalPath -like '*OllamaFluent*' -or $_.physicalPath -like "*$newSite*" }
          if (-not $old -or (Get-Website -Name $newSite)) {
            Write-Host '[migrate] skip - OllamaArena ja existente'
            exit 0
          }
          $st = @($old)
          if ($st.Count -gt 1) { throw "Multiplos sites candidatos: " + (($st | ForEach-Object Name) -join ', ') }
          $oldName   = $old.Name
          $oldPool   = $old.applicationPool
          $oldPath   = $old.physicalPath
          $bk = Join-Path $env:RUNNER_TEMP ('BackupIIS_' + (Get-Date -Format yyyyMMdd_HHmmss))
          New-Item -ItemType Directory -Path $bk -Force | Out-Null
          Get-Item "$oldPath\ollama_benchmark.db*" -EA SilentlyContinue | Copy-Item -Destination $bk -Force
          Get-Item "$oldPath\appsettings.Local.json" -EA SilentlyContinue | Copy-Item -Destination $bk -Force
          Get-Item "$oldPath\web.config"             -EA SilentlyContinue | Copy-Item -Destination $bk -Force
          Write-Host "[migrate] backup DB+Local+cfg -> $bk"
          $poolState = (Get-WebAppPoolState -Name $oldPool -ErrorAction SilentlyContinue).Value
          if ($poolState -eq 'Started') { Stop-WebAppPool -Name $oldPool }
          $siteState = (Get-WebsiteState -Name $oldName -ErrorAction SilentlyContinue).Value
          if ($siteState -eq 'Started') { Stop-Website -Name $oldName }
          Start-Sleep -Seconds 2
          if (Test-Path $target) { throw "Destino ja existe: $target" }
          Move-Item -LiteralPath $oldPath -Destination $target
          Rename-Item "IIS:\AppPools\$oldPool" -NewName $newSite
          Rename-Item "IIS:\Sites\$oldName"    -NewName $newSite
          Set-ItemProperty "IIS:\Sites\$newSite" physicalPath   $target
          Set-ItemProperty "IIS:\Sites\$newSite" applicationPool $newSite
          Get-WebBinding -Name $newSite | ForEach-Object { Remove-WebBinding -Name $newSite -Protocol $_.protocol -BindingInformation $_.bindingInformation }
          New-WebBinding -Name $newSite -Protocol http -Port 4800
          icacls $target /grant "IIS AppPool\${newSite}:(OI)(CI)M" | Out-Null
          Start-WebAppPool -Name $newSite
          Start-WebSite   -Name $newSite
          Write-Host '[migrate] concluido: site+pool+pasta -> OllamaArena, binding http *:4800'

      - name: Migrate IIS OllamaFluentUIChat -> OllamaArena (idempotente, roda como SYSTEM)
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration
          $target = 'C:\inetpub\wwwroot\OllamaArena'
          $newSite = 'OllamaArena'
          $newPool = 'OllamaArena'
          if (Get-Website -Name $newSite) {
            Write-Host '[migrate] Ja migrado - skip'
          } else {
            $site = Get-Website | Where-Object { $_.physicalPath -like '*OllamaFluent*' }
            if (-not $site) { Write-Host '[migrate] Site antigo nao encontrado - skip'; exit 0 }
            $oldName = $site.Name
            $oldPool = $site.applicationPool
            $oldPath = $site.physicalPath
            Write-Host "[migrate] Site:$oldName pool:$oldPool path:$oldPath"
            $poolState = (Get-WebAppPoolState -Name $oldPool -ErrorAction SilentlyContinue).Value
            if ($poolState -eq 'Started') { Stop-WebAppPool -Name $oldPool }
            $siteState = (Get-WebsiteState -Name $oldName -ErrorAction SilentlyContinue).Value
            if ($siteState -eq 'Started') { Stop-WebSite -Name $oldName }
            Start-Sleep -Seconds 2
            if (-not (Test-Path $target)) {
              Move-Item -LiteralPath $oldPath -Destination $target
              Write-Host "[migrate] pasta movida -> $target"
            } else {
              Write-Host '[migrate] destino ja existe (mantem DB/chaves)'
            }
            Rename-Item "IIS:\AppPools\$oldPool" -NewName $newPool
            Rename-Item "IIS:\Sites\$oldName"    -NewName $newSite
            Set-ItemProperty "IIS:\Sites\$newSite" physicalPath   -Value $target
            Set-ItemProperty "IIS:\Sites\$newSite" applicationPool -Value $newPool
            New-WebBinding -Name $newSite -Protocol http -Port 4800
            Write-Host '[migrate] site/pool -> OllamaArena @ :4800'
            Start-WebAppPool -Name $newPool
            Start-WebSite -Name $newSite
          }

      - name: Take site offline
        run: |
          Import-Module WebAdministration
          $poolState = (Get-WebAppPoolState -Name $env:IIS_APP_POOL -ErrorAction SilentlyContinue).Value
          if ($poolState -eq 'Started') { Stop-WebAppPool -Name $env:IIS_APP_POOL }
          Write-Host "App pool stopped: $env:IIS_APP_POOL"

      - name: Deploy files (preserving DB and local config)
        run: |
          $ErrorActionPreference = 'Stop'
          $site = $env:IIS_SITE_PATH
          $publish = Join-Path $env:RUNNER_TEMP 'publish'
          $keep = @(
            'ollama_benchmark.db',
            'ollama_benchmark.db-shm',
            'ollama_benchmark.db-wal',
            'ollama_benchmark.db-journal',
            'appsettings.Local.json'
          )
          $maxAttempts = 30
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              Get-ChildItem -LiteralPath $site -Force | Where-Object { $_.Name -notin $keep } | ForEach-Object {
                Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction Stop
              }
              break
            } catch {
              if ($i -eq $maxAttempts) { throw }
              Start-Sleep -Seconds 2
            }
          }

          Get-ChildItem -LiteralPath $publish | Where-Object { $_.Name -ne 'appsettings.Local.json' } |
            Copy-Item -Destination $site -Recurse -Force

          $local = Join-Path $site 'appsettings.Local.json'
          $cfg = if (Test-Path $local) { Get-Content -LiteralPath $local -Raw | ConvertFrom-Json } else { [pscustomobject]@{} }
          $cfg | Add-Member -NotePropertyName Security -NotePropertyValue ([pscustomobject]@{ EnableHttpsRedirection = $false }) -Force
          $cfg | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $local -Encoding utf8

      - name: Bring site online
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name $env:IIS_APP_POOL
          Write-Host "App pool started: $env:IIS_APP_POOL"

      - name: Smoke test
        run: |
          Start-Sleep -Seconds 10
          $r = Invoke-WebRequest -Uri "http://localhost:$env:SITE_PORT" -UseBasicParsing -TimeoutSec 120
          Write-Host "HTTP $($r.StatusCode) - $($r.RawContentLength) bytes"
          if ($r.StatusCode -ne 200) { throw "Smoke test failed: HTTP $($r.StatusCode)" }
